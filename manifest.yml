modules:
  jira:issuePanel:
    - key: recurrence-radar-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: recurrence-radar
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/8ed0b7f6-9b89-454e-8a68-85e9c99daf0b
