modules:
  jira:issuePanel:
    - key: rr-issue-panel
      resource: panel
      resolver:
        function: resolver
      viewportSize: medium
      title: Recurrence Radar
      icon: resource:panel;icon.svg
  jira:issueGlance:
    - key: rr-issue-glance
      resource: glance
      resolver:
        function: resolver
      title: Recurrence Radar
      label: Recurrence check
      status:
        type: lozenge
        value:
          label: Check
          type: default
  jira:adminPage:
    - key: rr-admin-page
      resource: admin
      resolver:
        function: resolver
      title: Recurrence Radar
  jira:projectPage:
    - key: rr-project-page
      resource: overview
      resolver:
        function: resolver
      title: Recurrence Radar
  trigger:
    - key: rr-issue-trigger
      function: issue-trigger
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
    - key: rr-lifecycle-trigger
      function: lifecycle-trigger
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  consumer:
    - key: rr-analyze-consumer
      queue: rr-analyze
      function: analyze-consumer
  sql:
    - key: main
      engine: mysql
  llm:
    - key: rr-llm
      model:
        - claude
  function:
    - key: resolver
      handler: index.resolverHandler
    - key: issue-trigger
      handler: index.issueTrigger
    - key: lifecycle-trigger
      handler: index.lifecycleTrigger
    - key: analyze-consumer
      handler: index.consumerHandler
      timeoutSeconds: 600
resources:
  - key: panel
    path: static/ui/build/panel
  - key: glance
    path: static/ui/build/glance
  - key: admin
    path: static/ui/build/admin
  - key: overview
    path: static/ui/build/overview
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-project
    - manage:jira-configuration
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/8ed0b7f6-9b89-454e-8a68-85e9c99daf0b
